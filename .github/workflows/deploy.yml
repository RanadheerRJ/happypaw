name: CI / CD to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_REF: pghtjewnyogtbbigjanm
  # Workflow-level env CAN reference secrets. Job-level `if` cannot, so the
  # migrate job gates on github.ref and checks these vars at step level.
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  migrate:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    # Only run migrations on main. Job-level `if` cannot reference secrets
    # or env, so the job always runs on main: the first step exits cleanly
    # when credentials are absent and the remaining steps skip — the schema
    # is already applied and the build still deploys.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check for Supabase credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD are not set — skipping migrations. The schema is already applied; the build will continue."
            exit 0
          fi
          echo "Supabase credentials present — applying migrations."

      - name: Install Supabase CLI
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npm install -g supabase

      - name: Link project
        if: env.SUPABASE_ACCESS_TOKEN != ''
        working-directory: supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --token "$SUPABASE_ACCESS_TOKEN"

      - name: Push migrations
        if: env.SUPABASE_ACCESS_TOKEN != ''
        working-directory: supabase
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --force-reset

  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guards against a silently broken deploy: if Pages is set to the legacy
      # branch build, the artifact uploaded below is never served and the URL
      # returns the raw repo root (blank page). Fail with an actionable message
      # instead of deploying nowhere.
      - name: Verify Pages serves the Actions artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || echo unknown)"
          echo "Pages build_type before: ${build_type}"

          if [ "${build_type}" != "workflow" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1 || true
            build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || echo unknown)"
          fi

          if [ "${build_type}" != "workflow" ]; then
            echo "::error::GitHub Pages is using the '${build_type}' build type, so this artifact will not be served. Fix once in Settings > Pages > Build and deployment > Source = GitHub Actions. See README section 6."
            exit 1
          fi
          echo "Pages is configured to serve the Actions artifact."

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build (live Supabase)
        env:
          # Project pages live at https://<user>.github.io/<repo>/.
          # For a <user>.github.io repository, set this to "/".
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_ROUTER_MODE: hash
          # The anon key is publishable (safe for the browser); the URL is
          # public. Both can be moved to Settings > Variables if preferred.
          VITE_SUPABASE_URL: https://pghtjewnyogtbbigjanm.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY repository variable is not set. Add it in Settings > Variables (publishable key: sb_publishable_d7elpPAe0OBx7-KDCBNDyA_AO_icl6e)."
            exit 1
          fi
          npm run build
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    # The github-pages environment's branch policy only permits deployments
    # from main, so never attempt to deploy from PRs or feature branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
