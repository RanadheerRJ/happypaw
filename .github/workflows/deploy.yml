name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guards against a silently broken deploy: if Pages is set to the legacy
      # branch build, the artifact uploaded below is never served and the URL
      # returns the raw repo root (blank page). Fail with an actionable message
      # instead of deploying nowhere.
      - name: Verify Pages serves the Actions artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || echo unknown)"
          echo "Pages build_type before: ${build_type}"

          if [ "${build_type}" != "workflow" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1 || true
            build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || echo unknown)"
          fi

          if [ "${build_type}" != "workflow" ]; then
            echo "::error::GitHub Pages is using the '${build_type}' build type, so this artifact will not be served. Fix once in Settings > Pages > Build and deployment > Source = GitHub Actions. See README section 6."
            exit 1
          fi
          echo "Pages is configured to serve the Actions artifact."

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build (GitHub Pages, mock data, demo mode)
        env:
          # Project pages live at https://<user>.github.io/<repo>/.
          # For a <user>.github.io repository, set this to "/".
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DATA_MODE: mock
          VITE_DEMO_MODE: 'true'
          VITE_ROUTER_MODE: hash
        run: |
          npm run build
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
